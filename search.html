<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ZinnekeTiles — recherche data</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    .maplibregl-ctrl-attrib { font-size: 10px; }
    #panel {
      position: absolute; z-index: 2;
      top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px;
      display: flex; flex-direction: column; gap: 6px;
      padding: 8px 10px; max-width: calc(100vw - 40px);
      background: rgba(255, 255, 255, 0.92); color: #1a1a1a;
      border-radius: 6px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); font-size: 13px;
    }
    #panel form { display: flex; flex-direction: column; gap: 4px; }
    #conds { display: flex; flex-direction: column; gap: 4px; }
    .cond { display: grid; grid-template-columns: auto 1fr 1fr auto auto; gap: 4px; align-items: center; }
    .cond .not { font-size: 11px; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
    .cond .rm { padding: 2px 6px; }
    #opts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 6px; }
    #panel label { display: flex; flex-direction: column; font-size: 11px; color: #555; }
    #panel input, #panel select { font: inherit; padding: 4px 6px; min-width: 0; }
    #files { min-height: 4.5em; }
    #panel button { font: inherit; padding: 5px 10px; cursor: pointer; }
    #actions { display: flex; gap: 4px; }
    #actions button[type=submit] { flex: 1; }
    #status { color: #555; }
    #list {
      margin: 0; padding: 0; list-style: none;
      max-height: 40vh; overflow: auto; max-width: calc(100vw - 60px);
    }
    #list li { padding: 3px 0; border-top: 1px solid #e5e5e5; cursor: pointer; }
    #list li:first-child { border-top: none; }
    #list li:hover { background: #f0f0f0; }
    #list small { color: #777; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <form id="form">
    <div id="conds"></div>
    <div id="opts">
      <label>Combinaison
        <select id="combine">
          <option value="and">toutes (and)</option>
          <option value="or">au moins une (or)</option>
        </select>
      </label>
      <label>Fichiers PMTiles
        <select id="files" multiple></select>
      </label>
    </div>
    <div id="actions">
      <button type="button" id="add">+ critère</button>
      <button type="submit">Rechercher dans la vue</button>
    </div>
  </form>
  <template id="cond-tpl">
    <div class="cond">
      <label class="not"><input type="checkbox" class="negate" />not</label>
      <input class="key" placeholder="clé" />
      <input class="value" placeholder="valeur" />
      <select class="mode">
        <option value="exact">=</option>
        <option value="contains">~</option>
        <option value="exists">*</option>
      </select>
      <button type="button" class="rm" title="supprimer">×</button>
    </div>
  </template>
  <div id="status"></div>
  <ul id="list"></ul>
</div>
<script>
const TILES_BASE = 'https://pasloin.github.io/ZinnekeTiles/';
const MANIFEST_URL = new URL('styles.json', location.href).href;
const MAX_TILES = 400;

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile.bind(protocol));

let map = null;
let codecs = null;
const archives = new Map();

function absolutize(style) {
  for (const src of Object.values(style.sources)) {
    const u = (src.url || '').trim();
    if (!u.endsWith('.pmtiles')) continue;
    src.url = 'pmtiles://' + TILES_BASE + u.split('/').pop();
  }
  return style;
}

function populateFiles(style) {
  const sel = document.getElementById('files');
  sel.innerHTML = '';
  for (const [name, src] of Object.entries(style.sources)) {
    const u = (src.url || '');
    if (!u.endsWith('.pmtiles')) continue;
    const opt = document.createElement('option');
    opt.value = u.replace(/^pmtiles:\/\//, '');
    opt.textContent = name;
    opt.selected = /poi/i.test(name) || /poi/i.test(u);
    sel.appendChild(opt);
  }
  if (!sel.selectedOptions.length && sel.options.length) sel.options[0].selected = true;
}

async function loadPatterns(patterns) {
  const PATTERN_PIXEL_RATIO = 2;
  await Promise.all(Object.entries(patterns || {}).map(async ([name, cfg]) => {
    try {
      const url = URL.createObjectURL(new Blob(
        [await (await fetch(new URL(cfg.file, TILES_BASE).href)).text()],
        { type: 'image/svg+xml;charset=utf-8' }));
      try {
        const img = new Image();
        await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url; });
        const px = Math.round((cfg.size || 32) * PATTERN_PIXEL_RATIO);
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = px;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, px, px);
        if (!map.hasImage(name)) map.addImage(name, ctx.getImageData(0, 0, px, px), { pixelRatio: PATTERN_PIXEL_RATIO });
      } finally { URL.revokeObjectURL(url); }
    } catch (err) {
      console.warn('Motif indisponible :', name, err);
    }
  }));
  map.triggerRepaint();
}

async function initMap() {
  const manifest = await (await fetch(MANIFEST_URL, { cache: 'no-cache' })).json();
  const entries = manifest.styles || [];
  const wanted = new URL(location.href).searchParams.get('style');
  const entry = entries.find(s => s.id === wanted)
    || entries.find(s => s.url && s.url.includes('typologie'))
    || entries.find(s => s.id === manifest.default)
    || entries[0];
  const style = absolutize(await (await fetch(new URL(entry.url, location.href).href, { cache: 'no-cache' })).json());
  populateFiles(style);
  const meta = style.metadata['brussels:map'] || {};
  map = new maplibregl.Map({
    container: 'map',
    style,
    center: meta.center || [4.3517, 50.8503],
    zoom: meta.zoom || 13,
    hash: true,
    minZoom: 10,
    maxZoom: 19,
  });
  map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
  map.addControl(new maplibregl.ScaleControl({ maxWidth: 100, unit: 'metric' }), 'bottom-left');
  map.once('load', () => loadPatterns(style.metadata['brussels:patterns']));
}

function tileXY(lon, lat, z) {
  const n = 2 ** z, s = Math.sin(lat * Math.PI / 180);
  return [
    Math.floor((lon + 180) / 360 * n),
    Math.floor((0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n)
  ];
}

async function getCodecs() {
  if (!codecs) {
    const [{ VectorTile }, { default: Pbf }] = await Promise.all([
      import('https://esm.sh/@mapbox/vector-tile@1.3.1'),
      import('https://esm.sh/pbf@3.2.1'),
    ]);
    codecs = { VectorTile, Pbf };
  }
  return codecs;
}

function getArchive(url) {
  if (!archives.has(url)) archives.set(url, new pmtiles.PMTiles(url));
  return archives.get(url);
}

function buildMatcher(cond) {
  const key = cond.key.trim();
  const value = cond.value.trim();
  const lower = value.toLowerCase();
  let m;
  switch (cond.mode) {
    case 'exists': m = props => props[key] != null; break;
    case 'contains': m = props => props[key] != null && String(props[key]).toLowerCase().includes(lower); break;
    default: m = props => props[key] != null && String(props[key]) === value;
  }
  return cond.negate ? props => !m(props) : m;
}

function buildQuery(conditions, combine) {
  const matchers = conditions.map(buildMatcher);
  return combine === 'or'
    ? props => matchers.some(m => m(props))
    : props => matchers.every(m => m(props));
}

function formatQuery(conditions, combine) {
  return conditions.map(c => {
    const op = c.mode === 'exists' ? '' : (c.mode === 'contains' ? '~' : '=');
    const body = c.mode === 'exists' ? `${c.key}=*` : `${c.key}${op}${c.value}`;
    return c.negate ? `not ${body}` : body;
  }).join(` ${combine} `);
}

function extendBbox(bb, coords) {
  if (typeof coords[0] === 'number') {
    if (coords[0] < bb[0]) bb[0] = coords[0];
    if (coords[1] < bb[1]) bb[1] = coords[1];
    if (coords[0] > bb[2]) bb[2] = coords[0];
    if (coords[1] > bb[3]) bb[3] = coords[1];
  } else {
    for (const c of coords) extendBbox(bb, c);
  }
  return bb;
}

function featureKey(f, fileName, layerName, bb) {
  if (f.id != null) return `${fileName}|${layerName}|${f.id}`;
  const round = v => v.toFixed(f.type === 1 ? 6 : 3);
  return `${fileName}|${layerName}|${JSON.stringify(f.properties)}|${round(bb[0])}|${round(bb[1])}`;
}

async function search(conditions, combine, files) {
  const { VectorTile, Pbf } = await getCodecs();
  const b = map.getBounds();
  const view = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()];
  const matches = buildQuery(conditions, combine);
  const intersects = bb => bb[0] <= view[2] && bb[2] >= view[0] && bb[1] <= view[3] && bb[3] >= view[1];

  const hits = new Map();
  let nTiles = 0;
  for (const file of files) {
    const archive = getArchive(file.url);
    const h = await archive.getHeader();
    const west = Math.max(view[0], h.minLon), east = Math.min(view[2], h.maxLon);
    const south = Math.max(view[1], h.minLat), north = Math.min(view[3], h.maxLat);
    if (west > east || south > north) continue;

    const z = h.maxZoom;
    const [x0, y0] = tileXY(west, north, z);
    const [x1, y1] = tileXY(east, south, z);
    const total = (x1 - x0 + 1) * (y1 - y0 + 1);
    if (total > MAX_TILES) throw new Error(`${file.name} : vue trop large (${total} tuiles, max ${MAX_TILES}), zoomez davantage`);

    for (let x = x0; x <= x1; x++) {
      for (let y = y0; y <= y1; y++) {
        const t = await archive.getZxy(z, x, y);
        if (!t) continue;
        nTiles++;
        const vt = new VectorTile(new Pbf(new Uint8Array(t.data)));
        for (const [layerName, layer] of Object.entries(vt.layers)) {
          for (let i = 0; i < layer.length; i++) {
            const f = layer.feature(i);
            if (!matches(f.properties)) continue;
            const geom = f.toGeoJSON(x, y, z).geometry;
            const bb = extendBbox([Infinity, Infinity, -Infinity, -Infinity], geom.coordinates);
            if (!intersects(bb)) continue;
            const key = featureKey(f, file.name, layerName, bb);
            const existing = hits.get(key);
            if (existing) {
              existing.parts.push(geom);
              extendBbox(existing.bbox, geom.coordinates);
            } else {
              hits.set(key, { props: f.properties, file: file.name, layer: layerName, parts: [geom], bbox: bb });
            }
          }
        }
      }
    }
  }
  return { hits: [...hits.values()], nTiles };
}

function esc(s) {
  return String(s).replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
}

function ensureLayers() {
  if (map.getSource('hits')) return;
  map.addSource('hits', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'hits-fill', type: 'fill', source: 'hits',
    filter: ['==', '$type', 'Polygon'],
    paint: { 'fill-color': '#d33', 'fill-opacity': 0.25 },
  });
  map.addLayer({
    id: 'hits-line', type: 'line', source: 'hits',
    filter: ['in', '$type', 'Polygon', 'LineString'],
    paint: { 'line-color': '#d33', 'line-width': 2 },
  });
  map.addLayer({
    id: 'hits-circle', type: 'circle', source: 'hits',
    filter: ['==', '$type', 'Point'],
    paint: {
      'circle-radius': 7,
      'circle-color': '#d33',
      'circle-stroke-width': 2,
      'circle-stroke-color': '#fff',
    },
  });
}

function showResults({ hits, nTiles }, conditions, combine) {
  const status = document.getElementById('status');
  const list = document.getElementById('list');
  ensureLayers();
  map.getSource('hits').setData({
    type: 'FeatureCollection',
    features: hits.map(h => ({
      type: 'Feature',
      geometry: h.parts.length === 1 ? h.parts[0] : { type: 'GeometryCollection', geometries: h.parts },
      properties: { name: h.props.name || '' },
    })),
  });

  list.innerHTML = '';
  for (const h of hits) {
    const li = document.createElement('li');
    const detail = conditions
      .filter(c => h.props[c.key] != null)
      .map(c => `${esc(c.key)}=${esc(h.props[c.key])}`)
      .join(' · ');
    li.innerHTML = `<strong>${esc(h.props.name || '(sans nom)')}</strong><br><small>${esc(h.file)}/${esc(h.layer)} · ${detail}</small>`;
    li.addEventListener('click', () => {
      const [w, s, e, n] = h.bbox;
      if (w === e && s === n) map.flyTo({ center: [w, s], zoom: 18 });
      else map.fitBounds([[w, s], [e, n]], { padding: 80, maxZoom: 18 });
    });
    list.appendChild(li);
  }
  status.textContent = `${hits.length} résultat(s) pour ${formatQuery(conditions, combine)} dans la vue · ${nTiles} tuile(s)`;
}

const condsEl = document.getElementById('conds');

function addCondition(init = {}) {
  const node = document.getElementById('cond-tpl').content.firstElementChild.cloneNode(true);
  node.querySelector('.key').value = init.key || '';
  node.querySelector('.value').value = init.value || '';
  node.querySelector('.mode').value = init.mode || 'exact';
  node.querySelector('.negate').checked = !!init.negate;
  const syncValue = () => { node.querySelector('.value').disabled = node.querySelector('.mode').value === 'exists'; };
  node.querySelector('.mode').addEventListener('change', syncValue);
  syncValue();
  node.querySelector('.rm').addEventListener('click', () => {
    node.remove();
    if (!condsEl.children.length) addCondition();
  });
  condsEl.appendChild(node);
  return node;
}

function readConditions() {
  return [...condsEl.querySelectorAll('.cond')].map(n => ({
    key: n.querySelector('.key').value,
    value: n.querySelector('.value').value,
    mode: n.querySelector('.mode').value,
    negate: n.querySelector('.negate').checked,
  })).filter(c => c.key.trim());
}

function readFiles() {
  return [...document.getElementById('files').selectedOptions].map(o => ({ name: o.textContent, url: o.value }));
}

document.getElementById('add').addEventListener('click', () => addCondition().querySelector('.key').focus());

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const status = document.getElementById('status');
  if (!map) { status.textContent = 'Carte non chargée'; return; }
  const conditions = readConditions();
  const combine = document.getElementById('combine').value;
  const files = readFiles();
  if (!conditions.length) { status.textContent = 'Au moins un critère avec une clé'; return; }
  if (conditions.every(c => c.negate)) { status.textContent = 'Il faut au moins un critère positif'; return; }
  if (!files.length) { status.textContent = 'Sélectionnez au moins un fichier PMTiles'; return; }
  status.textContent = 'Lecture des PMTiles…';
  try {
    showResults(await search(conditions, combine, files), conditions, combine);
  } catch (err) {
    status.textContent = 'Erreur : ' + err.message;
    console.error(err);
  }
});

addCondition({ key: 'cuisine', value: 'friture' });
initMap().catch(err => console.error('Impossible de charger le style :', err));
</script>
</body>
</html>
