<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ZinnekeTiles — noir et blanc</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    #map { position: absolute; inset: 0; }
    .maplibregl-ctrl-attrib { font-size: 10px; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
const STYLE_URL = 'https://pasloin.github.io/ZinnekeTiles/style.nb.json';
const PATTERN_PIXEL_RATIO = 2;

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile.bind(protocol));

function absolutize(style) {
  for (const src of Object.values(style.sources)) {
    if (src.url && src.url.endsWith('.pmtiles')) {
      src.url = 'pmtiles://' + new URL(src.url, STYLE_URL).href;
    }
  }
  return style;
}

async function rasterize(svgText, size) {
  const url = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' }));
  try {
    const img = new Image();
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url; });
    const px = Math.round(size * PATTERN_PIXEL_RATIO);
    const canvas = document.createElement('canvas');
    canvas.width = px;
    canvas.height = px;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, px, px);
    return ctx.getImageData(0, 0, px, px);
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function loadPatterns(map, patterns) {
  await Promise.all(Object.entries(patterns || {}).map(async ([name, cfg]) => {
    try {
      let svg = await (await fetch(new URL(cfg.file, STYLE_URL).href)).text();
      for (const [from, to] of Object.entries(cfg.replace || {})) svg = svg.split(from).join(to);
      const data = await rasterize(svg, cfg.size || 32);
      if (!map.hasImage(name)) map.addImage(name, data, { pixelRatio: PATTERN_PIXEL_RATIO });
    } catch (err) {
      console.warn('Motif indisponible :', name, err);
    }
  }));
  map.triggerRepaint();
}

fetch(STYLE_URL)
  .then(r => r.json())
  .then(raw => {
    const style = absolutize(raw);
    const meta = style.metadata['brussels:map'] || {};
    const map = new maplibregl.Map({
      container: 'map',
      style,
      center: meta.center || [4.3517, 50.8503],
      zoom: meta.zoom || 13,
      hash: true,
      minZoom: 10,
      maxZoom: 19,
    });
    map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
    map.addControl(new maplibregl.ScaleControl({ maxWidth: 100, unit: 'metric' }), 'bottom-left');
    map.on('load', () => loadPatterns(map, style.metadata['brussels:patterns']));
    window.map = map;
  })
  .catch(err => console.error('Impossible de charger le style :', err));
</script>
</body>
</html>
