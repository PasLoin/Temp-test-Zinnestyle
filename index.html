<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ZinnekeTiles — style aléatoire</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    .maplibregl-ctrl-attrib { font-size: 10px; }
    #switcher {
      position: absolute; z-index: 2;
      top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px;
      display: flex; flex-direction: column; gap: 4px;
      padding: 8px 10px; max-width: calc(100vw - 40px);
      background: rgba(255, 255, 255, 0.92); color: #1a1a1a;
      border-radius: 6px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); font-size: 13px;
    }
    #switcher[hidden] { display: none; }
    #switcher select { font: inherit; max-width: 100%; }
    #switcher small { color: #555; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="switcher" hidden>
  <label for="style-select">Style</label>
  <select id="style-select"></select>
  <small id="style-date"></small>
</div>
<script>
const TILES_BASE = 'https://pasloin.github.io/ZinnekeTiles/';
const MANIFEST_URL = new URL('styles.json', location.href).href;
const PATTERN_PIXEL_RATIO = 2;

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile.bind(protocol));

let map = null;
let patternToken = 0;

function absolutize(style) {
  for (const src of Object.values(style.sources)) {
    if (src.url && src.url.endsWith('.pmtiles')) {
      src.url = 'pmtiles://' + new URL(src.url, TILES_BASE).href;
    }
  }
  return style;
}

async function rasterize(svgText, size) {
  const url = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' }));
  try {
    const img = new Image();
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url; });
    const px = Math.round(size * PATTERN_PIXEL_RATIO);
    const canvas = document.createElement('canvas');
    canvas.width = px;
    canvas.height = px;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, px, px);
    return ctx.getImageData(0, 0, px, px);
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function loadPatterns(patterns) {
  const token = ++patternToken;
  await Promise.all(Object.entries(patterns || {}).map(async ([name, cfg]) => {
    try {
      let svg = await (await fetch(new URL(cfg.file, TILES_BASE).href)).text();
      for (const [from, to] of Object.entries(cfg.replace || {})) svg = svg.split(from).join(to);
      const data = await rasterize(svg, cfg.size || 32);
      if (token === patternToken && !map.hasImage(name)) map.addImage(name, data, { pixelRatio: PATTERN_PIXEL_RATIO });
    } catch (err) {
      console.warn('Motif indisponible :', name, err);
    }
  }));
  if (token === patternToken) map.triggerRepaint();
}

function stampDate(label) {
  const match = /·\s*(\d{9,11})\b/.exec(label || '');
  if (!match) return '';
  const date = new Date(Number(match[1]) * 1000);
  return 'Généré le ' + date.toLocaleString('fr-BE', { dateStyle: 'long', timeStyle: 'short', timeZone: 'Europe/Brussels' });
}

async function fetchStyle(entry) {
  const raw = await (await fetch(new URL(entry.url, location.href).href, { cache: 'no-cache' })).json();
  return absolutize(raw);
}

async function showStyle(entry) {
  const style = await fetchStyle(entry);
  const variant = style.metadata['brussels:variant'] || {};
  const label = variant.label || entry.label;
  document.title = 'ZinnekeTiles — ' + label;
  document.getElementById('style-date').textContent = stampDate(label);
  const patterns = style.metadata['brussels:patterns'];
  if (!map) {
    const meta = style.metadata['brussels:map'] || {};
    map = new maplibregl.Map({
      container: 'map',
      style,
      center: meta.center || [4.3517, 50.8503],
      zoom: meta.zoom || 13,
      hash: true,
      minZoom: 10,
      maxZoom: 19,
    });
    map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
    map.addControl(new maplibregl.ScaleControl({ maxWidth: 100, unit: 'metric' }), 'bottom-left');
    window.map = map;
    map.once('load', () => loadPatterns(patterns));
  } else {
    map.once('style.load', () => loadPatterns(patterns));
    map.setStyle(style, { diff: false });
  }
  const url = new URL(location.href);
  url.searchParams.set('style', entry.id);
  history.replaceState(null, '', url);
}

async function start() {
  const manifest = await (await fetch(MANIFEST_URL, { cache: 'no-cache' })).json();
  const entries = (manifest.styles || [])
    .filter(s => s.id !== manifest.default)
    .sort((a, b) => (a.id === 'chaos') - (b.id === 'chaos'));
  if (!entries.length) throw new Error('aucun style dans styles.json');
  const wanted = new URL(location.href).searchParams.get('style');
  const current = entries.find(s => s.id === wanted) || entries[0];
  const select = document.getElementById('style-select');
  for (const entry of entries) {
    const option = document.createElement('option');
    option.value = entry.id;
    option.textContent = entry.label.split(' · ')[0];
    option.selected = entry === current;
    select.append(option);
  }
  select.addEventListener('change', () => {
    showStyle(entries.find(s => s.id === select.value)).catch(err => console.error('Impossible de charger le style :', err));
  });
  document.getElementById('switcher').hidden = entries.length < 2;
  await showStyle(current);
}

start().catch(err => console.error('Impossible de charger le style :', err));
</script>
</body>
</html>
