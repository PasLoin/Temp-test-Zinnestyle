<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ZinnekeTiles — recherche POI</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    .maplibregl-ctrl-attrib { font-size: 10px; }
    #panel {
      position: absolute; z-index: 2;
      top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px;
      display: flex; flex-direction: column; gap: 6px;
      padding: 8px 10px; max-width: calc(100vw - 40px);
      background: rgba(255, 255, 255, 0.92); color: #1a1a1a;
      border-radius: 6px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); font-size: 13px;
    }
    #panel form { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 6px; }
    #panel label { display: flex; flex-direction: column; font-size: 11px; color: #555; }
    #panel input, #panel select { font: inherit; padding: 4px 6px; min-width: 0; }
    #panel button { font: inherit; padding: 5px 10px; cursor: pointer; grid-column: 1 / -1; }
    #status { color: #555; }
    #list {
      margin: 0; padding: 0; list-style: none;
      max-height: 40vh; overflow: auto; max-width: calc(100vw - 60px);
    }
    #list li { padding: 3px 0; border-top: 1px solid #e5e5e5; cursor: pointer; }
    #list li:first-child { border-top: none; }
    #list li:hover { background: #f0f0f0; }
    #list small { color: #777; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <form id="form">
    <label>Clé<input id="key" value="cuisine" list="keys" /></label>
    <label>Valeur<input id="value" value="friture" /></label>
    <label>Mode
      <select id="mode">
        <option value="exact">exact</option>
        <option value="contains">contient</option>
        <option value="exists">clé présente</option>
      </select>
    </label>
    <label>Couche<input id="layer" placeholder="toutes" /></label>
    <button>Rechercher dans la vue</button>
  </form>
  <datalist id="keys">
    <option value="name"><option value="amenity"><option value="shop"><option value="cuisine">
    <option value="toilets"><option value="wheelchair"><option value="opening_hours">
  </datalist>
  <div id="status"></div>
  <ul id="list"></ul>
</div>
<script>
const TILES_BASE = 'https://pasloin.github.io/ZinnekeTiles/';
const POI_URL = TILES_BASE + 'poi.pmtiles';
const MANIFEST_URL = new URL('styles.json', location.href).href;
const MAX_TILES = 400;

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile.bind(protocol));

let map = null;
let poi = null;
let codecs = null;

function absolutize(style) {
  for (const src of Object.values(style.sources)) {
    const u = (src.url || '').trim();
    if (!u.endsWith('.pmtiles')) continue;
    src.url = 'pmtiles://' + TILES_BASE + u.split('/').pop();
  }
  return style;
}

async function loadPatterns(patterns) {
  const PATTERN_PIXEL_RATIO = 2;
  await Promise.all(Object.entries(patterns || {}).map(async ([name, cfg]) => {
    try {
      const url = URL.createObjectURL(new Blob(
        [await (await fetch(new URL(cfg.file, TILES_BASE).href)).text()],
        { type: 'image/svg+xml;charset=utf-8' }));
      try {
        const img = new Image();
        await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url; });
        const px = Math.round((cfg.size || 32) * PATTERN_PIXEL_RATIO);
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = px;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, px, px);
        if (!map.hasImage(name)) map.addImage(name, ctx.getImageData(0, 0, px, px), { pixelRatio: PATTERN_PIXEL_RATIO });
      } finally { URL.revokeObjectURL(url); }
    } catch (err) {
      console.warn('Motif indisponible :', name, err);
    }
  }));
  map.triggerRepaint();
}

async function initMap() {
  const manifest = await (await fetch(MANIFEST_URL, { cache: 'no-cache' })).json();
  const entries = manifest.styles || [];
  const wanted = new URL(location.href).searchParams.get('style');
  const entry = entries.find(s => s.id === wanted)
    || entries.find(s => s.url && s.url.includes('typologie'))
    || entries.find(s => s.id === manifest.default)
    || entries[0];
  const style = absolutize(await (await fetch(new URL(entry.url, location.href).href, { cache: 'no-cache' })).json());
  const meta = style.metadata['brussels:map'] || {};
  map = new maplibregl.Map({
    container: 'map',
    style,
    center: meta.center || [4.3517, 50.8503],
    zoom: meta.zoom || 13,
    hash: true,
    minZoom: 10,
    maxZoom: 19,
  });
  map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
  map.addControl(new maplibregl.ScaleControl({ maxWidth: 100, unit: 'metric' }), 'bottom-left');
  map.once('load', () => loadPatterns(style.metadata['brussels:patterns']));
}

function tileXY(lon, lat, z) {
  const n = 2 ** z, s = Math.sin(lat * Math.PI / 180);
  return [
    Math.floor((lon + 180) / 360 * n),
    Math.floor((0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n)
  ];
}

async function getCodecs() {
  if (!codecs) {
    const [{ VectorTile }, { default: Pbf }] = await Promise.all([
      import('https://esm.sh/@mapbox/vector-tile@1.3.1'),
      import('https://esm.sh/pbf@3.2.1'),
    ]);
    codecs = { VectorTile, Pbf };
  }
  return codecs;
}

function buildMatcher(cond) {
  const key = cond.key.trim();
  const value = cond.value.trim();
  const lower = value.toLowerCase();
  switch (cond.mode) {
    case 'exists': return props => props[key] != null;
    case 'contains': return props => props[key] != null && String(props[key]).toLowerCase().includes(lower);
    default: return props => props[key] != null && String(props[key]) === value;
  }
}

async function search(conditions, layerFilter) {
  const { VectorTile, Pbf } = await getCodecs();
  if (!poi) poi = new pmtiles.PMTiles(POI_URL);
  const h = await poi.getHeader();
  const b = map.getBounds();
  const west = Math.max(b.getWest(), h.minLon);
  const east = Math.min(b.getEast(), h.maxLon);
  const south = Math.max(b.getSouth(), h.minLat);
  const north = Math.min(b.getNorth(), h.maxLat);
  if (west > east || south > north) return { hits: [], nTiles: 0, z: h.maxZoom };

  const z = h.maxZoom;
  const [x0, y0] = tileXY(west, north, z);
  const [x1, y1] = tileXY(east, south, z);
  const total = (x1 - x0 + 1) * (y1 - y0 + 1);
  if (total > MAX_TILES) throw new Error(`Vue trop large (${total} tuiles, max ${MAX_TILES}) : zoomez davantage`);

  const matchers = conditions.map(buildMatcher);
  const matches = props => matchers.every(m => m(props));
  const inView = (lon, lat) => lon >= west && lon <= east && lat >= south && lat <= north;

  const seen = new Set(), hits = [];
  let nTiles = 0;
  for (let x = x0; x <= x1; x++) {
    for (let y = y0; y <= y1; y++) {
      const t = await poi.getZxy(z, x, y);
      if (!t) continue;
      nTiles++;
      const vt = new VectorTile(new Pbf(new Uint8Array(t.data)));
      for (const [layerName, layer] of Object.entries(vt.layers)) {
        if (layerFilter && layerName !== layerFilter) continue;
        for (let i = 0; i < layer.length; i++) {
          const f = layer.feature(i);
          if (f.type !== 1) continue;
          if (!matches(f.properties)) continue;
          const [fx, fy] = f.toGeoJSON(x, y, z).geometry.coordinates;
          if (!inView(fx, fy)) continue;
          const id = f.id ?? `${fx.toFixed(6)}|${fy.toFixed(6)}`;
          if (seen.has(id)) continue;
          seen.add(id);
          hits.push({ props: f.properties, lon: fx, lat: fy, layer: layerName });
        }
      }
    }
  }
  return { hits, nTiles, z };
}

function esc(s) {
  return String(s).replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
}

function showResults({ hits, nTiles }, conditions) {
  const status = document.getElementById('status');
  const list = document.getElementById('list');
  const geo = {
    type: 'FeatureCollection',
    features: hits.map(h => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [h.lon, h.lat] },
      properties: { name: h.props.name || '(sans nom)' },
    })),
  };
  if (!map.getSource('hits')) {
    map.addSource('hits', { type: 'geojson', data: geo });
    map.addLayer({
      id: 'hits-circle', type: 'circle', source: 'hits',
      paint: {
        'circle-radius': 7,
        'circle-color': '#d33',
        'circle-stroke-width': 2,
        'circle-stroke-color': '#fff',
      },
    });
  } else {
    map.getSource('hits').setData(geo);
  }

  list.innerHTML = '';
  for (const h of hits) {
    const li = document.createElement('li');
    const detail = conditions
      .filter(c => c.mode !== 'exists' || h.props[c.key] != null)
      .map(c => `${esc(c.key)}=${esc(h.props[c.key])}`)
      .join(' · ');
    li.innerHTML = `<strong>${esc(h.props.name || '(sans nom)')}</strong><br><small>${esc(h.layer)} · ${detail}</small>`;
    li.addEventListener('click', () => map.flyTo({ center: [h.lon, h.lat], zoom: 18 }));
    list.appendChild(li);
  }
  const query = conditions.map(c => c.mode === 'exists' ? c.key : `${c.key}${c.mode === 'contains' ? '~' : '='}${c.value}`).join(' and ');
  status.textContent = `${hits.length} résultat(s) pour ${query} dans la vue · ${nTiles} tuile(s)`;
}

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const status = document.getElementById('status');
  if (!map) { status.textContent = 'Carte non chargée'; return; }
  const conditions = [{
    key: document.getElementById('key').value,
    value: document.getElementById('value').value,
    mode: document.getElementById('mode').value,
  }];
  const layerFilter = document.getElementById('layer').value.trim();
  if (!conditions[0].key.trim()) { status.textContent = 'Clé requise'; return; }
  status.textContent = 'Lecture du PMTiles…';
  try {
    showResults(await search(conditions, layerFilter), conditions);
  } catch (err) {
    status.textContent = 'Erreur : ' + err.message;
    console.error(err);
  }
});

initMap().catch(err => console.error('Impossible de charger le style :', err));
</script>
</body>
</html>
